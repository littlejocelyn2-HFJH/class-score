<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>課堂綜合評量與學習分析系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; 
      background-color: #f7f6f2; /* 柔和燕麥米色底 */
      color: #383e42;
    }
    .touch-btn:active { transform: scale(0.97); }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- 頂部標題列：莫蘭迪灰綠鼠尾草色 -->
  <header class="bg-[#5b7369] text-white shadow-xs sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-amber-100">
          <i class="fa-solid fa-feather-pointed text-base"></i>
        </div>
        <div>
          <h1 class="text-base font-medium tracking-wide leading-tight text-white">課堂評量與學習分析</h1>
          <p class="text-[11px] text-[#d1ded8]">即時點數 • 作業追蹤 • 個別學習診斷</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportToCSV()" class="touch-btn bg-white/15 hover:bg-white/25 text-xs text-white px-2.5 py-1.5 rounded-lg border border-white/20 flex items-center transition">
          <i class="fa-solid fa-download mr-1 opacity-80"></i> 匯出
        </button>
        <button onclick="resetData()" class="touch-btn bg-[#916262] hover:bg-[#805353] text-xs text-white px-2.5 py-1.5 rounded-lg border border-white/10 flex items-center transition">
          <i class="fa-solid fa-arrow-rotate-right mr-1 opacity-80"></i> 重設
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 sm:px-4 pt-3.5 space-y-3.5">

    <!-- 柔和質感分頁籤 -->
    <div class="flex bg-[#e9e6df] p-1 rounded-xl text-xs font-medium">
      <button onclick="switchTab('pointTab')" id="tab-point" class="flex-1 py-2 text-center rounded-lg bg-white shadow-xs text-[#40544c] font-semibold transition">
        <i class="fa-solid fa-chalkboard mr-1 opacity-70"></i> 課堂加分板
      </button>
      <button onclick="switchTab('homeworkTab')" id="tab-homework" class="flex-1 py-2 text-center rounded-lg text-[#6d757a] hover:text-[#383e42] transition">
        <i class="fa-regular fa-clipboard mr-1 opacity-70"></i> 作業缺交登記
      </button>
      <button onclick="switchTab('scoreTab')" id="tab-score" class="flex-1 py-2 text-center rounded-lg text-[#6d757a] hover:text-[#383e42] transition">
        <i class="fa-solid fa-chart-simple mr-1 opacity-70"></i> 學習狀態總表
      </button>
    </div>

    <!-- 1. 黑板加分分頁 -->
    <section id="pointTab" class="space-y-3">
      <!-- 快速輸入框 -->
      <div class="bg-white rounded-xl p-3.5 shadow-[0_1px_3px_rgba(0,0,0,0.04)] border border-[#e4e1d8]">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-[#545f66] flex items-center">
            <i class="fa-regular fa-pen-to-square text-[#8a9e94] mr-1.5"></i> 手抄筆記快速批次加分
          </span>
          <span class="text-[11px] text-[#9ba3a7]">格式例：1號+2, 5號+3</span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="quickAddInput" placeholder="輸入如：3號+2, 7號+1, 15+3" class="flex-1 bg-[#faf9f6] border border-[#d8d4c9] rounded-lg px-3 py-1.5 text-xs text-[#383e42] focus:outline-none focus:border-[#5b7369] transition">
          <button onclick="handleBatchAdd()" class="touch-btn bg-[#668074] hover:bg-[#5b7369] text-white text-xs font-medium px-3.5 py-1.5 rounded-lg shrink-0 shadow-xs transition">
            批次加入
          </button>
        </div>
      </div>

      <!-- 座號方格點按板 -->
      <div class="bg-white rounded-xl p-3.5 shadow-[0_1px_3px_rgba(0,0,0,0.04)] border border-[#e4e1d8]">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-xs font-semibold text-[#545f66] flex items-center">
            <i class="fa-solid fa-grip text-[#8a9e94] mr-1.5"></i> 座號點選給分
          </span>
          <div class="flex items-center space-x-1 bg-[#edeae1] p-0.5 rounded-md text-[11px]">
            <span class="text-[#757d82] px-1.5">每次：</span>
            <button onclick="setStep(1)" id="step-1" class="px-2 py-0.5 rounded bg-white text-[#40544c] font-bold shadow-xs">＋1</button>
            <button onclick="setStep(2)" id="step-2" class="px-2 py-0.5 rounded text-[#6d757a]">＋2</button>
            <button onclick="setStep(5)" id="step-5" class="px-2 py-0.5 rounded text-[#6d757a]">＋5</button>
          </div>
        </div>

        <div id="studentGrid" class="grid grid-cols-4 sm:grid-cols-7 gap-2">
          <!-- 動態生成座號方塊 -->
        </div>
      </div>
    </section>

    <!-- 2. 作業缺交分頁 -->
    <section id="homeworkTab" class="hidden space-y-3">
      <div class="bg-white rounded-xl p-3.5 shadow-[0_1px_3px_rgba(0,0,0,0.04)] border border-[#e4e1d8]">
        <h2 class="text-xs font-semibold text-[#545f66] mb-2 flex items-center">
          <i class="fa-solid fa-list-check text-[#8a9e94] mr-1.5"></i> 缺交座號登記
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mb-2.5">
          <div>
            <label class="text-[11px] text-[#757d82] block mb-1">作業單元</label>
            <select id="hwSelect" class="w-full bg-[#faf9f6] border border-[#d8d4c9] rounded-lg px-2.5 py-1.5 text-xs text-[#383e42] focus:outline-none focus:border-[#5b7369]">
              <option value="hw1">第 1 次作業</option>
              <option value="hw2">第 2 次作業</option>
              <option value="hw3" selected>第 3 次作業 (最新)</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label class="text-[11px] text-[#757d82] block mb-1">未交座號（逗號或空格隔開）</label>
            <div class="flex gap-2">
              <input type="text" id="missingHwInput" placeholder="例：3, 11, 24" class="flex-1 bg-[#faf9f6] border border-[#d8d4c9] rounded-lg px-3 py-1.5 text-xs text-[#383e42] focus:outline-none focus:border-[#5b7369]">
              <button onclick="recordMissingHw()" class="touch-btn bg-[#668074] hover:bg-[#5b7369] text-white text-xs font-medium px-3.5 py-1.5 rounded-lg shrink-0 transition">
                儲存登記
              </button>
            </div>
          </div>
        </div>
        <p class="text-[11px] text-[#9ba3a7]">未輸入之座號會自動計為「準時繳交」並累計完整出席率。</p>
      </div>

      <!-- 缺交名冊提醒 -->
      <div class="bg-[#f5eeeb] border border-[#e3d0ca] rounded-xl p-3">
        <h3 class="text-xs font-semibold text-[#8a5245] mb-1.5 flex items-center">
          <i class="fa-solid fa-circle-exclamation mr-1.5 opacity-80"></i> 累計缺交 2 次以上學生名冊
        </h3>
        <div id="hwWarningList" class="flex flex-wrap gap-1.5 text-xs"></div>
      </div>
    </section>

    <!-- 3. 全班總表分頁 -->
    <section id="scoreTab" class="hidden space-y-3">
      <!-- 統計數據小方塊 -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <div class="bg-white p-2.5 rounded-xl border border-[#e4e1d8] shadow-xs">
          <p class="text-[11px] text-[#757d82]">班級平均</p>
          <p id="statAvgScore" class="text-lg font-bold text-[#383e42] mt-0.5">--</p>
        </div>
        <div class="bg-white p-2.5 rounded-xl border border-[#e4e1d8] shadow-xs">
          <p class="text-[11px] text-[#757d82]">作業平均繳交率</p>
          <p id="statAvgHw" class="text-lg font-bold text-[#5b7369] mt-0.5">--%</p>
        </div>
        <div class="bg-white p-2.5 rounded-xl border border-[#e4e1d8] shadow-xs">
          <p class="text-[11px] text-[#757d82]">最高點數累積</p>
          <p id="statTopBonus" class="text-lg font-bold text-[#b57c43] mt-0.5">+0</p>
        </div>
        <div class="bg-white p-2.5 rounded-xl border border-[#e4e1d8] shadow-xs">
          <p class="text-[11px] text-[#757d82]">需關注人次</p>
          <p id="statAlertCount" class="text-lg font-bold text-[#9e5d5d] mt-0.5">0 人</p>
        </div>
      </div>

      <!-- 總表名單 -->
      <div class="bg-white rounded-xl shadow-xs border border-[#e4e1d8] overflow-hidden">
        <div class="p-2.5 border-b border-[#eeebe3] flex items-center justify-between">
          <span class="text-xs font-semibold text-[#545f66]">學生個別學習狀態</span>
          <button onclick="copyTableText()" class="text-[11px] text-[#5b7369] hover:underline font-medium">
            <i class="fa-regular fa-copy mr-1"></i>複製至試算表
          </button>
        </div>
        <div class="overflow-x-auto max-h-96">
          <table class="w-full text-left text-xs">
            <thead class="bg-[#faf9f6] text-[#757d82] sticky top-0 border-b border-[#e4e1d8] text-[11px]">
              <tr>
                <th class="py-2 px-3">座號</th>
                <th class="py-2 px-2">加分</th>
                <th class="py-2 px-2">作業率</th>
                <th class="py-2 px-2">測驗</th>
                <th class="py-2 px-2 font-bold text-[#40544c]">加權總分</th>
                <th class="py-2 px-3">學習狀態評估</th>
              </tr>
            </thead>
            <tbody id="scoreTableBody" class="divide-y divide-[#f2efe9] text-[#383e42]"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    const TOTAL_STUDENTS = 28;
    let currentStep = 1;

    let students = JSON.parse(localStorage.getItem('classroom_students')) || [];

    if (!students || students.length === 0) {
      students = Array.from({ length: TOTAL_STUDENTS }, (_, i) => {
        const id = i + 1;
        return {
          id: id,
          name: `學生 ${id}`,
          bonus: Math.floor(Math.random() * 8),
          hwMiss: (id === 3 || id === 11) ? 2 : (id === 18 ? 1 : 0),
          totalHw: 3,
          exam: Math.floor(68 + Math.random() * 28)
        };
      });
      saveData();
    }

    function saveData() {
      localStorage.setItem('classroom_students', JSON.stringify(students));
    }

    function setStep(val) {
      currentStep = val;
      [1, 2, 5].forEach(v => {
        const btn = document.getElementById(`step-${v}`);
        if (v === val) {
          btn.className = "px-2 py-0.5 rounded bg-white text-[#40544c] font-bold shadow-xs";
        } else {
          btn.className = "px-2 py-0.5 rounded text-[#6d757a]";
        }
      });
    }

    function addPoint(id, delta) {
      const stu = students.find(s => s.id === id);
      if (stu) {
        stu.bonus = Math.max(0, stu.bonus + delta);
        saveData();
        renderAll();
      }
    }

    function handleBatchAdd() {
      const input = document.getElementById('quickAddInput').value.trim();
      if (!input) return;

      const regex = /(\d+)\s*(?:號)?\s*\+\s*(\d+)/g;
      let match;
      let count = 0;
      while ((match = regex.exec(input)) !== null) {
        const id = parseInt(match[1]);
        const pts = parseInt(match[2]);
        const stu = students.find(s => s.id === id);
        if (stu) {
          stu.bonus += pts;
          count++;
        }
      }

      if (count > 0) {
        saveData();
        renderAll();
        document.getElementById('quickAddInput').value = '';
        alert(`已為 ${count} 位同學完成加分！`);
      } else {
        alert('請依照格式輸入，例如：1號+2, 5號+3');
      }
    }

    function recordMissingHw() {
      const input = document.getElementById('missingHwInput').value.trim();
      if (!input) return;

      const ids = input.split(/[,，\s]+/).map(v => parseInt(v)).filter(v => !isNaN(v));
      ids.forEach(id => {
        const stu = students.find(s => s.id === id);
        if (stu) {
          stu.hwMiss = (stu.hwMiss || 0) + 1;
        }
      });
      saveData();
      renderAll();
      document.getElementById('missingHwInput').value = '';
      alert(`已登記 ${ids.join(', ')} 號作業缺交！`);
    }

    function switchTab(tabId) {
      ['pointTab', 'homeworkTab', 'scoreTab'].forEach(t => {
        document.getElementById(t).classList.add('hidden');
      });
      document.getElementById(tabId).classList.remove('hidden');

      ['tab-point', 'tab-homework', 'tab-score'].forEach(btn => {
        document.getElementById(btn).className = "flex-1 py-2 text-center rounded-lg text-[#6d757a] transition";
      });

      const activeBtn = tabId === 'pointTab' ? 'tab-point' : (tabId === 'homeworkTab' ? 'tab-homework' : 'tab-score');
      document.getElementById(activeBtn).className = "flex-1 py-2 text-center rounded-lg bg-white shadow-xs text-[#40544c] font-semibold transition";
    }

    function getAnalysis(stu, total) {
      if (stu.hwMiss >= 2 || total < 60) {
        return { label: '需多關心', color: 'bg-[#faede9] text-[#915449] border-[#e8cdc5]', tip: '作業缺交較多或測驗未通' };
      }
      if (stu.bonus >= 6 && stu.exam >= 85) {
        return { label: '穩定領先', color: 'bg-[#edf3f0] text-[#426655] border-[#cbe0d5]', tip: '課堂反應良好，可任小組輔導員' };
      }
      if (stu.bonus >= 5 && stu.exam < 70) {
        return { label: '態度積極', color: 'bg-[#f8f2e6] text-[#85632a] border-[#e8d7b7]', tip: '課堂參與度佳，需加強核心概念' };
      }
      if (stu.exam >= 85 && stu.bonus <= 2) {
        return { label: '潛力型', color: 'bg-[#eaf1f5] text-[#3e5f73] border-[#cadbe6]', tip: '理解力佳，平時可多引導發言' };
      }
      return { label: '常態穩定', color: 'bg-[#f3f2ee] text-[#5c6569] border-[#dedcd3]', tip: '表現平穩，持續保持' };
    }

    function renderAll() {
      // 1. 方格板渲染
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';
      students.forEach(s => {
        const btn = document.createElement('div');
        btn.className = "touch-btn bg-[#faf9f6] border border-[#e4e1d8] rounded-lg p-2 flex flex-col items-center justify-between cursor-pointer hover:bg-[#f1eee6] transition";
        btn.onclick = () => addPoint(s.id, currentStep);
        btn.innerHTML = `
          <div class="flex justify-between w-full text-[11px] font-medium text-[#757d82]">
            <span>${s.id}號</span>
            <span class="text-[#b57c43] font-bold">+${s.bonus}</span>
          </div>
          <div class="my-0.5 text-center">
            <span class="text-xs text-[#383e42] font-medium block truncate">${s.name}</span>
          </div>
          <button class="w-full bg-[#668074] text-white rounded text-[11px] py-0.5 mt-0.5 font-medium">＋${currentStep}</button>
        `;
        grid.appendChild(btn);
      });

      // 2. 警示渲染
      const warnList = document.getElementById('hwWarningList');
      warnList.innerHTML = '';
      const missingList = students.filter(s => s.hwMiss >= 2);
      if (missingList.length === 0) {
        warnList.innerHTML = '<span class="text-[#5b7369] text-xs">全班作業繳交正常，無缺交 2 次以上者。</span>';
      } else {
        missingList.forEach(s => {
          const span = document.createElement('span');
          span.className = "bg-white text-[#915449] border border-[#e3d0ca] px-2 py-0.5 rounded text-[11px] font-medium";
          span.textContent = `${s.id} 號 (缺交 ${s.hwMiss} 次)`;
          warnList.appendChild(span);
        });
      }

      // 3. 總表渲染
      const tbody = document.getElementById('scoreTableBody');
      tbody.innerHTML = '';
      let sumScore = 0;
      let sumHwRate = 0;
      let maxBonus = 0;
      let alertCount = 0;

      students.forEach(s => {
        const hwRate = Math.max(0, Math.round(((s.totalHw - s.hwMiss) / s.totalHw) * 100));
        const bonusScore = Math.min(100, s.bonus * 12);
        const total = Math.round((bonusScore * 0.2) + (hwRate * 0.3) + (s.exam * 0.5));

        sumScore += total;
        sumHwRate += hwRate;
        if (s.bonus > maxBonus) maxBonus = s.bonus;

        const diag = getAnalysis(s, total);
        if (diag.label === '需多關心') alertCount++;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-[#faf9f6]";
        tr.innerHTML = `
          <td class="py-2 px-3 font-medium text-[#383e42]">${s.id} 號</td>
          <td class="py-2 px-2 text-[#b57c43] font-semibold">+${s.bonus}</td>
          <td class="py-2 px-2 ${hwRate < 70 ? 'text-[#9e5d5d] font-bold' : ''}">${hwRate}%</td>
          <td class="py-2 px-2">${s.exam}</td>
          <td class="py-2 px-2 font-bold text-[#40544c] text-sm">${total}</td>
          <td class="py-2 px-3">
            <span class="inline-block text-[10px] px-2 py-0.5 rounded border ${diag.color} font-medium mr-1.5">${diag.label}</span>
            <span class="text-[11px] text-[#8c9499] hidden sm:inline">${diag.tip}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('statAvgScore').textContent = Math.round(sumScore / students.length) + ' 分';
      document.getElementById('statAvgHw').textContent = Math.round(sumHwRate / students.length) + '%';
      document.getElementById('statTopBonus').textContent = '+' + maxBonus;
      document.getElementById('statAlertCount').textContent = alertCount + ' 人';
    }

    function exportToCSV() {
      let csv = "\uFEFF座號,姓名,加分,作業缺交次數,作業繳交率,測驗分數,平時總分,分析評析\n";
      students.forEach(s => {
        const hwRate = Math.max(0, Math.round(((s.totalHw - s.hwMiss) / s.totalHw) * 100));
        const total = Math.round((Math.min(100, s.bonus * 12) * 0.2) + (hwRate * 0.3) + (s.exam * 0.5));
        const diag = getAnalysis(s, total);
        csv += `${s.id},${s.name},${s.bonus},${s.hwMiss},${hwRate}%,${s.exam},${total},${diag.label} - ${diag.tip}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `課堂評量分析_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function copyTableText() {
      let text = "座號\t加分\t作業率\t測驗\t總分\t診斷\n";
      students.forEach(s => {
        const hwRate = Math.max(0, Math.round(((s.totalHw - s.hwMiss) / s.totalHw) * 100));
        const total = Math.round((Math.min(100, s.bonus * 12) * 0.2) + (hwRate * 0.3) + (s.exam * 0.5));
        const diag = getAnalysis(s, total);
        text += `${s.id}號\t+${s.bonus}\t${hwRate}%\t${s.exam}\t${total}\t${diag.label}\n`;
      });
      navigator.clipboard.writeText(text).then(() => alert('已複製表格，可直接貼至 Excel 或 Google 試算表！'));
    }

    function resetData() {
      if (confirm('確定要清空並重設所有點數與缺交記錄嗎？')) {
        localStorage.removeItem('classroom_students');
        location.reload();
      }
    }

    renderAll();
  </script>
</body>
</html>
