<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>課堂綜合評量與學習分析系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .touch-btn:active { transform: scale(0.96); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- 頂部標題列 -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-graduation-cap text-2xl text-yellow-300"></i>
        <div>
          <h1 class="text-lg font-bold leading-tight">課堂綜合評量與學習分析</h1>
          <p class="text-xs text-indigo-200">即時加分 • 作業追蹤 • 個人學習診斷</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportToCSV()" class="touch-btn bg-indigo-600 hover:bg-indigo-500 text-xs px-2.5 py-1.5 rounded-lg border border-indigo-400 flex items-center">
          <i class="fa-solid fa-file-excel mr-1"></i> 匯出CSV
        </button>
        <button onclick="resetData()" class="touch-btn bg-rose-600 hover:bg-rose-500 text-xs px-2.5 py-1.5 rounded-lg border border-rose-400 flex items-center">
          <i class="fa-solid fa-rotate-right mr-1"></i> 重設
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-4 pt-4 space-y-4">

    <!-- 快捷功能分頁籤 -->
    <div class="flex bg-slate-200 p-1 rounded-xl text-xs sm:text-sm font-medium">
      <button onclick="switchTab('pointTab')" id="tab-point" class="flex-1 py-2 text-center rounded-lg bg-white shadow-sm text-indigo-700 font-semibold transition">
        <i class="fa-solid fa-chalkboard-user mr-1"></i> 黑板與點數加分
      </button>
      <button onclick="switchTab('homeworkTab')" id="tab-homework" class="flex-1 py-2 text-center rounded-lg text-slate-600 hover:text-slate-900 transition">
        <i class="fa-solid fa-book-open mr-1"></i> 作業缺交登記
      </button>
      <button onclick="switchTab('scoreTab')" id="tab-score" class="flex-1 py-2 text-center rounded-lg text-slate-600 hover:text-slate-900 transition">
        <i class="fa-solid fa-chart-line mr-1"></i> 全班總表與分析
      </button>
    </div>

    <!-- 1. 黑板快速加分分頁 -->
    <section id="pointTab" class="space-y-4">
      <!-- 智慧批次文字輸入 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-bold text-slate-700 flex items-center">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-500 mr-1.5"></i> 手寫筆記/文字快速匯入加分
          </span>
          <span class="text-xs text-slate-400">例：1號+2, 5號+3, 12+1</span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="quickAddInput" placeholder="輸入或貼上：3號+2, 7號+1, 15號+3" class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button onclick="handleBatchAdd()" class="touch-btn bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-xl shrink-0 shadow-sm">
            套用加分
          </button>
        </div>
      </div>

      <!-- 課堂座號點按加分板 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-bold text-slate-700 flex items-center">
            <i class="fa-solid fa-hand-pointer text-indigo-500 mr-1.5"></i> 課堂觸控快速給分板
          </span>
          <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg text-xs">
            <span class="text-slate-500 px-1">步進：</span>
            <button onclick="setStep(1)" id="step-1" class="px-2 py-0.5 rounded bg-indigo-600 text-white font-bold">＋1</button>
            <button onclick="setStep(2)" id="step-2" class="px-2 py-0.5 rounded text-slate-600">＋2</button>
            <button onclick="setStep(5)" id="step-5" class="px-2 py-0.5 rounded text-slate-600">＋5</button>
          </div>
        </div>

        <div id="studentGrid" class="grid grid-cols-4 sm:grid-cols-7 gap-2">
          <!-- 自動由 JavaScript 動態生成 1~28 號按鈕 -->
        </div>
      </div>
    </section>

    <!-- 2. 作業缺交登記分頁 -->
    <section id="homeworkTab" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold text-slate-700 mb-2 flex items-center">
          <i class="fa-solid fa-list-check text-indigo-500 mr-1.5"></i> 登記第幾次作業缺交名單
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
          <div>
            <label class="text-xs text-slate-500 block mb-1">選擇作業次數</label>
            <select id="hwSelect" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="hw1">第 1 次作業 (已登記)</option>
              <option value="hw2">第 2 次作業 (已登記)</option>
              <option value="hw3" selected>第 3 次作業 (最新)</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label class="text-xs text-slate-500 block mb-1">未交/缺交座號（逗號或空格分開）</label>
            <div class="flex gap-2">
              <input type="text" id="missingHwInput" placeholder="例：3, 11, 24" class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <button onclick="recordMissingHw()" class="touch-btn bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-xl shrink-0">
                登記缺交
              </button>
            </div>
          </div>
        </div>
        <p class="text-xs text-slate-400">💡 說明：登記後，未被列入的座號將自動標註為「準時繳交」並累計完整出席率。</p>
      </div>

      <!-- 作業即時警示名冊 -->
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4">
        <h3 class="text-xs font-bold text-amber-800 uppercase tracking-wider mb-2 flex items-center">
          <i class="fa-solid fa-triangle-exclamation mr-1.5 text-amber-600"></i> 作業高風險名單（缺交 2 次以上）
        </h3>
        <div id="hwWarningList" class="flex flex-wrap gap-2 text-xs">
          <!-- 動態生成警示標籤 -->
        </div>
      </div>
    </section>

    <!-- 3. 全班總表與學習分析分頁 -->
    <section id="scoreTab" class="hidden space-y-4">
      <!-- 統計資訊卡片 -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500">班級平均分</p>
          <p id="statAvgScore" class="text-xl font-extrabold text-slate-800 mt-0.5">--</p>
        </div>
        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500">作業平均繳交率</p>
          <p id="statAvgHw" class="text-xl font-extrabold text-indigo-600 mt-0.5">--%</p>
        </div>
        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500">最高累積加分</p>
          <p id="statTopBonus" class="text-xl font-extrabold text-emerald-600 mt-0.5">+0</p>
        </div>
        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500">需輔導關注人數</p>
          <p id="statAlertCount" class="text-xl font-extrabold text-rose-600 mt-0.5">0 人</p>
        </div>
      </div>

      <!-- 成績名單大表 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-3 border-b border-slate-100 flex items-center justify-between">
          <span class="text-sm font-bold text-slate-700">學生個人學習狀態評估</span>
          <button onclick="copyTableText()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">
            <i class="fa-regular fa-copy mr-1"></i>複製表格內容
          </button>
        </div>
        <div class="overflow-x-auto max-h-96">
          <table class="w-full text-left text-xs sm:text-sm">
            <thead class="bg-slate-50 text-slate-500 sticky top-0 border-b border-slate-200 text-xs">
              <tr>
                <th class="py-2.5 px-3">座號</th>
                <th class="py-2.5 px-2">加分</th>
                <th class="py-2.5 px-2">作業率</th>
                <th class="py-2.5 px-2">測驗</th>
                <th class="py-2.5 px-2 font-bold text-indigo-700">總分</th>
                <th class="py-2.5 px-3">學習型態與診斷</th>
              </tr>
            </thead>
            <tbody id="scoreTableBody" class="divide-y divide-slate-100 text-slate-700">
              <!-- 動態生成各座號列 -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    // 初始化 28 位學生數據
    const TOTAL_STUDENTS = 28;
    let currentStep = 1;

    let students = JSON.parse(localStorage.getItem('classroom_students')) || [];

    if (!students || students.length === 0) {
      students = Array.from({ length: TOTAL_STUDENTS }, (_, i) => {
        const id = i + 1;
        // 預設示範數據
        return {
          id: id,
          name: `學生 ${id}`,
          bonus: Math.floor(Math.random() * 8),
          hwMiss: (id === 3 || id === 11) ? 2 : (id === 18 ? 1 : 0),
          totalHw: 3,
          exam: Math.floor(65 + Math.random() * 32)
        };
      });
      saveData();
    }

    function saveData() {
      localStorage.setItem('classroom_students', JSON.stringify(students));
    }

    function setStep(val) {
      currentStep = val;
      [1, 2, 5].forEach(v => {
        const btn = document.getElementById(`step-${v}`);
        if (v === val) {
          btn.className = "px-2 py-0.5 rounded bg-indigo-600 text-white font-bold";
        } else {
          btn.className = "px-2 py-0.5 rounded text-slate-600";
        }
      });
    }

    function addPoint(id, delta) {
      const stu = students.find(s => s.id === id);
      if (stu) {
        stu.bonus = Math.max(0, stu.bonus + delta);
        saveData();
        renderAll();
      }
    }

    function handleBatchAdd() {
      const input = document.getElementById('quickAddInput').value.trim();
      if (!input) return;

      // 解析類似 1號+2, 5+3, 14號+1 等格式
      const regex = /(\d+)\s*(?:號)?\s*\+\s*(\d+)/g;
      let match;
      let count = 0;
      while ((match = regex.exec(input)) !== null) {
        const id = parseInt(match[1]);
        const pts = parseInt(match[2]);
        const stu = students.find(s => s.id === id);
        if (stu) {
          stu.bonus += pts;
          count++;
        }
      }

      if (count > 0) {
        saveData();
        renderAll();
        document.getElementById('quickAddInput').value = '';
        alert(`成功為 ${count} 位同學完成黑板加分！`);
      } else {
        alert('格式無法辨識，請使用例如：1號+2, 5號+3');
      }
    }

    function recordMissingHw() {
      const input = document.getElementById('missingHwInput').value.trim();
      if (!input) return;

      const ids = input.split(/[,，\s]+/).map(v => parseInt(v)).filter(v => !isNaN(v));
      ids.forEach(id => {
        const stu = students.find(s => s.id === id);
        if (stu) {
          stu.hwMiss = (stu.hwMiss || 0) + 1;
        }
      });
      saveData();
      renderAll();
      document.getElementById('missingHwInput').value = '';
      alert(`已登記 ${ids.join(', ')} 號作業缺交！`);
    }

    function switchTab(tabId) {
      ['pointTab', 'homeworkTab', 'scoreTab'].forEach(t => {
        document.getElementById(t).classList.add('hidden');
      });
      document.getElementById(tabId).classList.remove('hidden');

      ['tab-point', 'tab-homework', 'tab-score'].forEach(btn => {
        document.getElementById(btn).className = "flex-1 py-2 text-center rounded-lg text-slate-600 transition";
      });

      const activeBtn = tabId === 'pointTab' ? 'tab-point' : (tabId === 'homeworkTab' ? 'tab-homework' : 'tab-score');
      document.getElementById(activeBtn).className = "flex-1 py-2 text-center rounded-lg bg-white shadow-sm text-indigo-700 font-semibold transition";
    }

    function getAnalysis(stu, total) {
      const hwRate = ((stu.totalHw - stu.hwMiss) / stu.totalHw) * 100;
      if (stu.hwMiss >= 2 || total < 60) {
        return { label: '高風險需關注', color: 'bg-rose-100 text-rose-700 border-rose-300', tip: '作業缺交嚴重或成績低落，建議聯繫' };
      }
      if (stu.bonus >= 6 && stu.exam >= 85) {
        return { label: '穩定領先型', color: 'bg-emerald-100 text-emerald-700 border-emerald-300', tip: '課堂活躍且理解極佳，可任小老師' };
      }
      if (stu.bonus >= 5 && stu.exam < 70) {
        return { label: '態度積極待補強', color: 'bg-amber-100 text-amber-700 border-amber-300', tip: '發言踴躍但觀念未通，需個別指導' };
      }
      if (stu.exam >= 85 && stu.bonus <= 2) {
        return { label: '高理解低動機', color: 'bg-sky-100 text-sky-700 border-sky-300', tip: '理解力佳但少參與，可多給予提問' };
      }
      return { label: '常態表現', color: 'bg-slate-100 text-slate-600 border-slate-300', tip: '各項發展穩定，持續維持' };
    }

    function renderAll() {
      // 1. 渲染網格加分板
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';
      students.forEach(s => {
        const btn = document.createElement('div');
        btn.className = "touch-btn bg-slate-50 border border-slate-200 rounded-xl p-2.5 flex flex-col items-center justify-between cursor-pointer hover:bg-indigo-50 hover:border-indigo-300 transition shadow-xs";
        btn.onclick = () => addPoint(s.id, currentStep);
        btn.innerHTML = `
          <div class="flex justify-between w-full text-xs font-bold text-slate-500">
            <span>${s.id}號</span>
            <span class="text-emerald-600 font-extrabold">+${s.bonus}</span>
          </div>
          <div class="my-1 text-center">
            <span class="text-xs text-slate-700 block truncate font-medium">${s.name}</span>
          </div>
          <button class="w-full bg-indigo-600 text-white rounded text-xs py-0.5 mt-1 font-semibold">＋${currentStep}</button>
        `;
        grid.appendChild(btn);
      });

      // 2. 渲染作業警示名冊
      const warnList = document.getElementById('hwWarningList');
      warnList.innerHTML = '';
      const missingList = students.filter(s => s.hwMiss >= 2);
      if (missingList.length === 0) {
        warnList.innerHTML = '<span class="text-emerald-600 font-medium">全班作業繳交狀況良好，無缺交 2 次以上者！</span>';
      } else {
        missingList.forEach(s => {
          const span = document.createElement('span');
          span.className = "bg-rose-100 text-rose-700 border border-rose-300 px-2 py-1 rounded-md font-bold";
          span.textContent = `${s.id} 號 (累計缺交 ${s.hwMiss} 次)`;
          warnList.appendChild(span);
        });
      }

      // 3. 渲染成績總表與統計
      const tbody = document.getElementById('scoreTableBody');
      tbody.innerHTML = '';
      let sumScore = 0;
      let sumHwRate = 0;
      let maxBonus = 0;
      let alertCount = 0;

      students.forEach(s => {
        const hwRate = Math.max(0, Math.round(((s.totalHw - s.hwMiss) / s.totalHw) * 100));
        // 平時總分權重：加分 20% (上限100) + 作業率 30% + 測驗 50%
        const bonusScore = Math.min(100, s.bonus * 12);
        const total = Math.round((bonusScore * 0.2) + (hwRate * 0.3) + (s.exam * 0.5));

        sumScore += total;
        sumHwRate += hwRate;
        if (s.bonus > maxBonus) maxBonus = s.bonus;

        const diag = getAnalysis(s, total);
        if (diag.label === '高風險需關注') alertCount++;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50";
        tr.innerHTML = `
          <td class="py-2.5 px-3 font-semibold text-slate-800">${s.id} 號</td>
          <td class="py-2.5 px-2 text-emerald-600 font-bold">+${s.bonus}</td>
          <td class="py-2.5 px-2 ${hwRate < 70 ? 'text-rose-600 font-bold' : ''}">${hwRate}%</td>
          <td class="py-2.5 px-2">${s.exam}</td>
          <td class="py-2.5 px-2 font-bold text-indigo-700 text-base">${total}</td>
          <td class="py-2.5 px-3">
            <span class="inline-block text-[11px] px-2 py-0.5 rounded-full border ${diag.color} font-medium mr-1.5">${diag.label}</span>
            <span class="text-xs text-slate-400 hidden sm:inline">${diag.tip}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('statAvgScore').textContent = Math.round(sumScore / students.length) + ' 分';
      document.getElementById('statAvgHw').textContent = Math.round(sumHwRate / students.length) + '%';
      document.getElementById('statTopBonus').textContent = '+' + maxBonus;
      document.getElementById('statAlertCount').textContent = alertCount + ' 人';
    }

    function exportToCSV() {
      let csv = "\uFEFF座號,姓名,加分,作業缺交次數,作業繳交率,測驗分數,加權總分,學習狀態評析\n";
      students.forEach(s => {
        const hwRate = Math.max(0, Math.round(((s.totalHw - s.hwMiss) / s.totalHw) * 100));
        const bonusScore = Math.min(100, s.bonus * 12);
        const total = Math.round((bonusScore * 0.2) + (hwRate * 0.3) + (s.exam * 0.5));
        const diag = getAnalysis(s, total);
        csv += `${s.id},${s.name},${s.bonus},${s.hwMiss},${hwRate}%,${s.exam},${total},${diag.label} - ${diag.tip}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `課堂學習評量分析_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function copyTableText() {
      let text = "座號\t加分\t作業率\t測驗\t總分\t診斷\n";
      students.forEach(s => {
        const hwRate = Math.max(0, Math.round(((s.totalHw - s.hwMiss) / s.totalHw) * 100));
        const total = Math.round((Math.min(100, s.bonus * 12) * 0.2) + (hwRate * 0.3) + (s.exam * 0.5));
        const diag = getAnalysis(s, total);
        text += `${s.id}號\t+${s.bonus}\t${hwRate}%\t${s.exam}\t${total}\t${diag.label}\n`;
      });
      navigator.clipboard.writeText(text).then(() => alert('已複製表格資料，可直接貼到 Excel 或 Google 試算表！'));
    }

    function resetData() {
      if (confirm('確定要清空並重設所有同學的加分與缺交記錄嗎？')) {
        localStorage.removeItem('classroom_students');
        location.reload();
      }
    }

    // 初始化渲染
    renderAll();
  </script>
</body>
</html>
